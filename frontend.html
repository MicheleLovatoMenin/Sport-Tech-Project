    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #050505; }

        /* --- 1. CONFIGURAZIONE CAMPO (Tuo Codice Originale Invariato) --- */
        .court-container {
            aspect-ratio: 50/47; 
            width: 100%;
            /* Aumentiamo il limite massimo per farlo diventare più grande */
            max-width: 950px; 
            position: relative;
            background-color: #0a0a0a;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(40,40,40, 0.4), rgba(0,0,0,0.95)), 
                linear-gradient(0deg, rgba(255,255,255,0.03) 1px, transparent 1px), 
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); 
            background-size: 100% 100%, 4% 4%, 4% 4%;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 80px rgba(0,0,0,0.9);
            border: 1px solid #222;
            margin: 0;
        }

        .court-line {
            position: absolute;
            border: 2px solid #f97316; 
            box-shadow: 0 0 6px #f97316, inset 0 0 6px rgba(249, 115, 22, 0.2);
            opacity: 0.9;
            z-index: 1; 
            pointer-events: none;
        }

        .court-key {
            position: absolute; width: 32%; height: 40.43%; left: 34%; top: 0; 
            background-color: rgba(249, 115, 22, 0.1); border: 2px solid #f97316; border-top: none; 
        }

        .court-freethrow-circle {
            position: absolute; width: 24%; height: 25.53%; left: 38%; top: 27.66%;
            border-radius: 50%; border: 2px solid #f97316; margin-top: -1px; 
            clip-path: polygon(0 50%, 100% 50%, 100% 100%, 0 100%);
        }
        
        .court-corner-patch {
            position: absolute; top: 0; left: 0; width: 15px; height: 15px;
            background-color: #0a0a0a; /* Stesso colore del fondo */
            z-index: 4; /* Sopra le linee ma sotto i marker */
        }

        .court-freethrow-dashed {
            position: absolute; width: 24%; height: 25.53%; left: 38%; top: 27.65%;
            border-radius: 50%; border: none;
            background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3e%3ccircle cx='50' cy='50' r='49' fill='none' stroke='rgba(249, 115, 22, 0.5)' stroke-width='1.5' stroke-dasharray='10%2c 15' /%3e%3c/svg%3e");
            clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%); z-index: 1;
        }

        .court-3pt-arc {
            position: absolute; width: 93%; padding-bottom: 93%; left: 3.5%; top: -39.36%;
            clip-path: polygon(0 50%, 100% 50%, 100% 150%, 0 150%); z-index: 5; pointer-events: none;
        }

        .court-3pt-arc::before {
            content: ''; position: absolute; inset: 0; border-radius: 50%;
            border: 2px solid #f97316; clip-path: polygon(0 68.4%, 100% 68.4%, 100% 130%, 0 130%); z-index: 2;
        }

        .court-3pt-line-left, .court-3pt-line-right {
            position: absolute; top: 0; width: 2px; height: 28.5%; background-color: #f97316; z-index: 1;
        }

        .court-3pt-line-left { left: 6.8%; }
        .court-3pt-line-right { right: 6.8%; }

        .court-backboard {
            width: 12%; height: 2px; background: #f97316; left: 44%; top: 8.51%; 
            box-shadow: 0 0 15px rgba(255,255,255,0.6); border: none; z-index: 2;
        }

        .court-hoop {
            width: 3%; height: 3.2%; left: 48.5%; top: 9.3%; 
            border: 2px solid #fff; background-color: rgba(249, 115, 22, 0.1); border-radius: 50%; 
            box-shadow: 0 0 8px #fff; z-index: 2;
        }

        .court-center-line {
            width: 100%; height: 2px; bottom: 0; left: 0; 
            border-bottom: 2px solid #f97316; box-shadow: 0 0 10px #f97316;
        }
        
        .court-center-circle-top {
            width: 24%; padding-bottom: 12%; left: 38%; bottom: 0; position: absolute;
            border-top-left-radius: 100px; border-top-right-radius: 100px; 
            border: 2px solid #f97316; border-bottom: none; z-index: 1;
        }

        .neon-text { text-shadow: 0 0 10px rgba(249, 115, 22, 0.8); }
        
        /* Marker Styles */
        .marker { transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 10; }
        .marker:hover { 
            z-index: 50; transform: translate(-50%, -50%) scale(1.5); 
            filter: drop-shadow(0 0 8px #f97316) brightness(1.3);
        }
        .marker.dimmed { opacity: 0.8; filter: grayscale(100%); transform: translate(-50%, -50%) scale(0.8); }
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-entry { animation: fade-in 0.8s ease-out forwards; }

        .court-container {
            aspect-ratio: 50/47; 
            width: 100%;
            /* Aumentiamo il limite massimo per farlo diventare più grande */
            max-width: 850px; 
            position: relative;
            background-color: #0a0a0a;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(40,40,40, 0.4), rgba(0,0,0,0.95)), 
                linear-gradient(0deg, rgba(255,255,255,0.03) 1px, transparent 1px), 
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); 
            background-size: 100% 100%, 4% 4%, 4% 4%;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 80px rgba(0,0,0,0.9);
            border: 1px solid #222;
            margin: 0; /* Rimosso auto perché lo gestisce il flex */
        }


        /* --- STILI NUOVI PER L'OVERLAY 3D --- */
        #overlay-3d {
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        
        #overlay-3d.hidden-overlay {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        
        #overlay-3d.visible-overlay {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        /* Spinner di caricamento */
        .loader {
            border: 4px solid rgba(249, 115, 22, 0.1);
            width: 36px; height: 36px; border-radius: 50%;
            border-left-color: #f97316;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>

   <div id="overlay-3d" class="fixed inset-0 z-50 bg-black/95 flex items-center justify-center hidden-overlay">
    
        <div class="absolute top-6 left-8 z-50 pointer-events-none">
            <h2 id="overlay-title" class="text-3xl font-bold text-orange-500 neon-text italic">REPLAY MODE</h2>

            </button>

                <i data-lucide="play" class="w-5 h-5 fill-current"></i>
            </button>
            <div class="w-px h-5 bg-neutral-700 mx-2"></div>

                RESET VIEW

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- VARIABILI GLOBALI ---
        let scene, camera, renderer, controls, animationId;
        let model = null;
        let mixer = null; // Gestore Animazioni
        let clock = new THREE.Clock(); // Per sincronizzare l'animazione
        
        const container = document.getElementById('canvas-container');
        const loaderSpinner = document.getElementById('loader-spinner');

        // --- 1. SETUP AMBIENTE ---
        function initThreeJS() {
            if (renderer) return; 

            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x151515); // Grigio scuro elegante
            // Nebbia più lontana per vedere l'ambiente (inizia a 20m, finisce a 100m)
            scene.fog = new THREE.Fog(0x151515, 20, 100); 

            // Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000); // 1000m di vista
            camera.position.set(0, 10, 20); // Posizione iniziale alta

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true; // Abilita ombre
            renderer.shadowMap.type = THREE.PCFSoftShadowMap; // Ombre morbide
            container.appendChild(renderer.domElement);

            // --- ILLUMINAZIONE AVANZATA (Fix Buio) ---
            
            // 1. Hemisphere Light: Luce ambiente naturale (Cielo bluastro / Terra scura)
            // Questo illumina TUTTO uniformemente, così non hai zone nere.
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
            hemiLight.position.set(0, 20, 0);
            scene.add(hemiLight);

            // 2. Directional Light: Il "Sole" o i riflettori dello stadio (fa le ombre)
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            // Aumenta l'area in cui le ombre vengono calcolate
            dirLight.shadow.camera.top = 20;
            dirLight.shadow.camera.bottom = -20;
            dirLight.shadow.camera.left = -20;
            dirLight.shadow.camera.right = 20;
            dirLight.shadow.mapSize.width = 2048; // Alta risoluzione ombre
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            // Griglia di riferimento molto grande (50x50 metri)
            const gridHelper = new THREE.GridHelper(50, 50, 0x444444, 0x222222);
            scene.add(gridHelper);

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; // Inerzia fluida
            controls.dampingFactor = 0.05;
            controls.enablePan = true; // ABILITA SPOSTAMENTO (Tasto Destro)
            controls.screenSpacePanning = false; // Pan sul piano orizzontale (come camminare)
            controls.minDistance = 2;   // Non entrare dentro il giocatore
            controls.maxDistance = 50;  // Non allontanarti troppo
            controls.maxPolarAngle = Math.PI / 2 - 0.05; // Non andare sotto il pavimento
            
            window.addEventListener('resize', onWindowResize);
        }

        // --- 2. CARICAMENTO E CENTRATURA ---
        function loadShotModel(matchId, eventId) {
            if(model) { scene.remove(model); model = null; }
            if(mixer) { mixer.stopAllAction(); mixer = null; }
            
            loaderSpinner.style.display = 'flex';

            const loader = new GLTFLoader();
            
            const fileName = `./output/${matchId}-${eventId}.glb`;

            loader.load(fileName, function (gltf) {
                model = gltf.scene;
                
                // Abilita le ombre su tutti gli oggetti del modello
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                scene.add(model);

                // --- FIX PIVOT (CENTRAGGIO AUTOMATICO) ---
                // 1. Calcola il box che contiene tutto il modello
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());

                // 2. Opzione A: Sposta il modello in modo che il suo centro sia a 0,0,0
                // model.position.x += (model.position.x - center.x);
                // model.position.z += (model.position.z - center.z);
                // model.position.y = 0; // Tieni i piedi per terra

                // 2. Opzione B (Migliore): Lascia il modello dov'è, ma sposta i CONTROLLI
                // Diciamo alla camera di guardare ESATTAMENTE al centro dell'azione
                controls.target.copy(center); 
                
                // Riposiziona la camera in una bella angolazione rispetto al centro
                camera.position.set(center.x + 10, center.y + 8, center.z + 10);
                controls.update(); // Applica i cambiamenti

                // --- ANIMAZIONE ---
                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(model);
                    // Fa partire tutte le animazioni trovate (es. giocatore, palla)
                    gltf.animations.forEach((clip) => {
                        mixer.clipAction(clip).play();
                    });
                }

                loaderSpinner.style.display = 'none';
                animate();

            }, undefined, function (error) {
                console.error(`Nessun replay trovato per ${fileName}`);
                
                // Importante: Spegni lo spinner altrimenti l'utente pensa che stia caricando
                loaderSpinner.style.display = 'none';
                
                // Opzionale: Mostra un messaggio a video "Replay non disponibile"
                document.getElementById('overlay-title').innerText = "REPLAY NON DISPONIBILE";
            });
        }

        function onWindowResize() {
            if(!camera) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            if (!document.getElementById('overlay-3d').classList.contains('visible-overlay')) return;

            animationId = requestAnimationFrame(animate);
            
            const delta = clock.getDelta(); // Tempo passato dall'ultimo frame
            if (mixer) mixer.update(delta); // Aggiorna animazione
            
            controls.update();
            renderer.render(scene, camera);
        }

        // --- FUNZIONI UTENTE (Globali) ---

        window.togglePlay = function(play) {
            if(!mixer) return;
            // TimeScale: 1 = normale, 0 = pausa, -1 = reverse
            mixer.timeScale = play ? 1 : 0;
        }

        window.resetCamera = function() {
            if(model && controls) {
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                controls.target.copy(center);
                camera.position.set(center.x + 10, center.y + 8, center.z + 10);
                controls.update();
            }
        }

        // Aggiornata per ricevere matchId e eventId
        window.openOverlay = function(matchId, eventId, playerName, result) {
            document.getElementById('overlay-3d').classList.remove('hidden-overlay');
            document.getElementById('overlay-3d').classList.add('visible-overlay');
            
            // Titolo dinamico
            document.getElementById('overlay-title').innerText = `${playerName.toUpperCase()} - ${result === 'make' ? "MAKE" : "MISS"}`;
            
            initThreeJS();
            
            // Passiamo gli ID alla funzione di caricamento
            loadShotModel(matchId, eventId);
            
            if(window.lucide) lucide.createIcons();
        }

        window.closeOverlay = function() {
            // 1. Nascondi Overlay
            const overlay = document.getElementById('overlay-3d');
            overlay.classList.remove('visible-overlay');
            overlay.classList.add('hidden-overlay');
            
            // 2. IMPORTANTE: Nascondi lo spinner (caso in cui si chiude durante il caricamento o errore)
            document.getElementById('loader-spinner').style.display = 'none';

            // 3. Ferma il loop di rendering
            if(animationId) cancelAnimationFrame(animationId);
            
            // 4. Pulisci scena e animazioni (se esistono)
            if(mixer) {
                mixer.stopAllAction();
                mixer = null;
            }
            
            // Opzionale: Resetta il titolo per la prossima volta
            setTimeout(() => {
                document.getElementById('overlay-title').innerText = "REPLAY MODE";
            }, 500);
        }
    </script>

    <script>
        // --- 1. VARIABILI GLOBALI ---
        let shotsData = []; // La lista ufficiale dei tiri che arriva dal backend
        const markersLayer = document.getElementById('markers-layer');

        // --- 2. FUNZIONE PER POPOLARE I FILTRI (Select menus) ---
        function populateFilters(filters) {
            const fillSelect = (id, list, allText) => {
                const select = document.getElementById(id);
                if (!select) return;
                // Pulisce e mette l'opzione di default
                select.innerHTML = `<option value="all">${allText}</option>`;
                // Aggiunge le opzioni dal backend
                list.forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item;
                    opt.textContent = item.toUpperCase();
                    select.appendChild(opt);
                });
            };

            populateFiltersData(filters); // Chiamata interna
        }

        // Helper per popolare i dati dei filtri
        function populateFiltersData(filters) {
            const fillSelect = (id, list, allText) => {
                const select = document.getElementById(id);
                if (!select) return;
                select.innerHTML = `<option value="all">${allText}</option>`;
                list.forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item;
                    opt.textContent = item.toUpperCase();
                    select.appendChild(opt);
                });
            };
            fillSelect('select-team', filters.teams, 'ALL TEAMS');
            fillSelect('select-game', filters.matches, 'ALL SEASON');
            fillSelect('select-player', filters.players, 'ALL PLAYERS');
        }

        // --- 3. FUNZIONE DI RENDERING (Disegna i tiri sul campo) ---
        function renderShots() {
            const teamFilter = document.getElementById('select-team').value;
            const gameFilter = document.getElementById('select-game').value;
            const playerFilter = document.getElementById('select-player').value;

            markersLayer.innerHTML = ''; 

            shotsData.forEach(shot => {
                // Calcolo posizioni in percentuale rispetto al campo 50x47 piedi
                const leftPos = (shot.x / 50) * 100;
                const topPos = (shot.y / 47) * 100;

                // Controllo dei 3 filtri incrociati
                const matchTeam = teamFilter === 'all' || shot.team === teamFilter;
                const matchGame = gameFilter === 'all' || shot.match === gameFilter;
                const matchPlayer = playerFilter === 'all' || shot.player === playerFilter;

                const isVisible = matchTeam && matchGame && matchPlayer;

                const el = document.createElement('div');
                el.className = `marker absolute flex items-center justify-center -translate-x-1/2 -translate-y-1/2 cursor-pointer`;
                el.style.left = `${leftPos}%`;
                el.style.top = `${topPos}%`;

                if (!isVisible) {
                    el.classList.add('dimmed'); // Se non passa il filtro, diventa grigio/trasparente
                } else {
                    // Cliccabile solo se visibile per l'overlay 3D
                    el.onclick = () => window.openOverlay(shot.matchId, shot.eventId, shot.player, shot.made ? 'make' : 'miss');
                }

                // Disegna l'icona: Cerchio (Segnato) o X (Sbagliato)
                if (shot.made) {
                    el.innerHTML = `<div class="w-3 h-3 md:w-4 md:h-4 rounded-full border-2 border-orange-500 bg-transparent shadow-[0_0_10px_#f97316]"></div>`;
                } else {
                    el.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 md:w-5 md:h-5 drop-shadow-[0_0_8px_#f97316]">
                            <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
                        </svg>`;
                }
                markersLayer.appendChild(el);
            });
            
            // Re-inizializza le icone di Lucide se necessario
            if(window.lucide) lucide.createIcons();
        }

        // --- 4. LOGICA DI CARICAMENTO INIZIALE ---
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Chiamata al tuo backend.py (porta 5000)
                const response = await fetch('http://127.0.0.1:5000/api/shots');
                
                if (!response.ok) throw new Error("Backend non raggiungibile");
                
                const data = await response.json();

                // 1. Salviamo i tiri nella variabile che usa renderShots
                shotsData = data.shots; 
                
                // 2. Popoliamo i menu a tendina con i dati reali del JSON
                populateFiltersData(data.filters);

                // 3. Colleghiamo l'evento "change" ai menu per aggiornare il campo
                ['select-team', 'select-game', 'select-player'].forEach(id => {
                    const selectEl = document.getElementById(id);
                    if(selectEl) selectEl.addEventListener('change', renderShots);
                });

                // 4. Primo disegno automatico
                renderShots();
                if(window.lucide) lucide.createIcons();

            } catch (error) {
                console.error("Errore fatale:", error);
                // Messaggio visivo per l'utente se dimentica di accendere Python
                markersLayer.innerHTML = `<div class="text-orange-500 font-bold p-10 text-center">ERRORE: Assicurati che backend.py sia attivo!</div>`;
            }
        });
    </script>
</body>
</html>
