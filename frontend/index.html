<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Shot Chart - 2D to 3D Bridge</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #050505; }

        /* --- 1. CONFIGURAZIONE CAMPO (Tuo Codice Originale Invariato) --- */
        .court-container {
            aspect-ratio: 50/47; 
            width: 100%;
            max-width: 666px; 
            position: relative;
            background-color: #0a0a0a;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(40,40,40, 0.4), rgba(0,0,0,0.95)), 
                linear-gradient(0deg, rgba(255,255,255,0.03) 1px, transparent 1px), 
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); 
            background-size: 100% 100%, 4% 4%, 4% 4%;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(0,0,0,0.8);
            border: 1px solid #222;
            margin: 0 auto;
        }

        .court-line {
            position: absolute;
            border: 2px solid #f97316; 
            box-shadow: 0 0 6px #f97316, inset 0 0 6px rgba(249, 115, 22, 0.2);
            opacity: 0.9;
            z-index: 1; 
            pointer-events: none;
        }

        .court-key {
            position: absolute; width: 32%; height: 40.43%; left: 34%; top: 0; 
            background-color: rgba(249, 115, 22, 0.1); border: 2px solid #f97316; border-top: none; 
        }

        .court-freethrow-circle {
            position: absolute; width: 24%; height: 25.53%; left: 38%; top: 27.66%;
            border-radius: 50%; border: 2px solid #f97316; margin-top: -1px; 
            clip-path: polygon(0 50%, 100% 50%, 100% 100%, 0 100%);
        }
        
        .court-freethrow-dashed {
            position: absolute; width: 24%; height: 25.53%; left: 38%; top: 27.65%;
            border-radius: 50%; border: none;
            background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3e%3ccircle cx='50' cy='50' r='49' fill='none' stroke='rgba(249, 115, 22, 0.5)' stroke-width='1.5' stroke-dasharray='10%2c 15' /%3e%3c/svg%3e");
            clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%); z-index: 1;
        }

        .court-3pt-arc {
            position: absolute; width: 95%; padding-bottom: 95%; left: 2.5%; top: -39.36%;
            clip-path: polygon(0 50%, 100% 50%, 100% 150%, 0 150%); z-index: 5; pointer-events: none;
        }

        .court-3pt-arc::before {
            content: ''; position: absolute; inset: 0; border-radius: 50%;
            border: 2px solid #f97316; clip-path: polygon(0 68.4%, 100% 68.4%, 100% 130%, 0 130%); z-index: 2;
        }

        .court-3pt-line-left, .court-3pt-line-right {
            position: absolute; top: 0; width: 2px; height: 29.9%; background-color: #f97316; z-index: 1;
        }
        .court-3pt-line-left { left: 5.81%; }
        .court-3pt-line-right { right: 5.81%; }

        .court-backboard {
            width: 12%; height: 2px; background: #f97316; left: 44%; top: 8.51%; 
            box-shadow: 0 0 15px rgba(255,255,255,0.6); border: none; z-index: 2;
        }

        .court-hoop {
            width: 3%; height: 3.2%; left: 48.5%; top: 9.3%; 
            border: 2px solid #fff; background-color: rgba(249, 115, 22, 0.1); border-radius: 50%; 
            box-shadow: 0 0 8px #fff; z-index: 2;
        }

        .court-center-line {
            width: 100%; height: 2px; bottom: 0; left: 0; 
            border-bottom: 2px solid #f97316; box-shadow: 0 0 10px #f97316;
        }
        
        .court-center-circle-top {
            width: 24%; padding-bottom: 12%; left: 38%; bottom: 0; position: absolute;
            border-top-left-radius: 100px; border-top-right-radius: 100px; 
            border: 2px solid #f97316; border-bottom: none; z-index: 1;
        }

        .neon-text { text-shadow: 0 0 10px rgba(249, 115, 22, 0.8); }
        
        /* Marker Styles */
        .marker { transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 10; }
        .marker:hover { 
            z-index: 50; transform: translate(-50%, -50%) scale(1.5); 
            filter: drop-shadow(0 0 8px #f97316) brightness(1.3);
        }
        .marker.dimmed { opacity: 0.15; filter: grayscale(100%); transform: translate(-50%, -50%) scale(0.8); }
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-entry { animation: fade-in 0.8s ease-out forwards; }

        /* --- STILI NUOVI PER L'OVERLAY 3D --- */
        #overlay-3d {
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        
        #overlay-3d.hidden-overlay {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        
        #overlay-3d.visible-overlay {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        /* Spinner di caricamento */
        .loader {
            border: 4px solid rgba(249, 115, 22, 0.1);
            width: 36px; height: 36px; border-radius: 50%;
            border-left-color: #f97316;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body class="bg-neutral-950 text-neutral-300 h-screen w-screen overflow-hidden flex flex-col items-center justify-center relative">

    <nav class="absolute top-0 w-full flex justify-between items-center py-6 px-8 z-40 pointer-events-none">
        <div class="pointer-events-auto flex items-center gap-2 text-orange-500">
            <i data-lucide="activity" class="w-6 h-6 neon-text"></i>
            <span class="font-bold tracking-widest text-sm neon-text">SPORT TECH 25/26</span>
        </div>
        <div class="pointer-events-auto">
            <button class="hover:text-orange-400 transition"><i data-lucide="menu" class="w-6 h-6"></i></button>
        </div>
    </nav>

    <main class="w-full max-w-4xl px-4 flex flex-col items-center animate-entry transition-all duration-500" id="dashboard-container">
        
        <div class="mb-6 text-center z-40">
            <h1 class="text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-b from-orange-400 to-orange-700 neon-text select-none mb-4">
                BASKET VIRTUALIZATION
            </h1>
            
            <div class="inline-flex bg-black/80 backdrop-blur border border-orange-500/30 rounded-full p-1 shadow-[0_0_15px_rgba(249,115,22,0.2)]">
                <button onclick="filterShots('all')" id="btn-all" class="px-6 py-2 text-xs font-bold rounded-full bg-orange-600 text-white shadow-[0_0_10px_rgba(249,115,22,0.5)] transition-all">ALL</button>
                <button onclick="filterShots('player')" id="btn-player" class="px-6 py-2 text-xs font-bold rounded-full text-neutral-500 hover:text-orange-400 transition-all">LEBRON</button>
            </div>
        </div>

        <div id="court-area" class="court-container">
            <div class="court-line court-key"></div>
            <div class="court-freethrow-circle"></div> 
            <div class="court-freethrow-dashed"></div> 
            <div class="court-3pt-line-left"></div>
            <div class="court-3pt-line-right"></div>
            <div class="court-3pt-arc"></div>
            <div class="court-line court-restricted"></div>
            <div class="court-line court-backboard"></div>
            <div class="court-line court-hoop"></div>
            <div class="court-line court-center-line"></div>
            <div class="court-center-circle-top"></div>
            <div id="markers-layer" class="absolute inset-0 w-full h-full z-10"></div>
        </div>
        
        <p class="mt-4 text-neutral-600 text-[10px] font-mono tracking-[0.2em] uppercase">by Michele Lovato Menin and Tommaso Ballarini</p>
    </main>

   <div id="overlay-3d" class="fixed inset-0 z-50 bg-black/95 flex items-center justify-center hidden-overlay">
    
        <div class="absolute top-6 left-8 z-50 pointer-events-none">
            <h2 id="overlay-title" class="text-3xl font-bold text-orange-500 neon-text italic">REPLAY MODE</h2>
            <p id="overlay-desc" class="text-xs text-neutral-400 font-mono mt-1 tracking-widest">INTERACTIVE VIEW</p>
        </div>

        <button onclick="closeOverlay()" class="absolute top-6 right-8 text-white hover:text-orange-500 transition z-50 bg-neutral-800 p-2 rounded-full hover:bg-neutral-700 border border-neutral-700">
            <i data-lucide="x" class="w-6 h-6"></i>
        </button>

        <div id="canvas-container" class="w-full h-full relative outline-none cursor-move">
            <div id="loader-spinner" class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div class="loader"></div>
            </div>
        </div>

        <div class="absolute bottom-10 left-1/2 -translate-x-1/2 z-50 flex gap-4 bg-neutral-900/80 backdrop-blur border border-neutral-700 px-6 py-3 rounded-full shadow-2xl">
            <button onclick="togglePlay(false)" class="text-neutral-400 hover:text-white transition tooltip" title="Pause">
                <i data-lucide="pause" class="w-5 h-5 fill-current"></i>
            </button>
            <button onclick="togglePlay(true)" class="text-orange-500 hover:text-orange-400 transition tooltip" title="Play">
                <i data-lucide="play" class="w-5 h-5 fill-current"></i>
            </button>
            <div class="w-px h-5 bg-neutral-700 mx-2"></div>
            <button onclick="resetCamera()" class="text-neutral-400 hover:text-white transition text-xs font-bold tracking-wider pt-1">
                RESET VIEW
            </button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- VARIABILI GLOBALI ---
        let scene, camera, renderer, controls, animationId;
        let model = null;
        let mixer = null; // Gestore Animazioni
        let clock = new THREE.Clock(); // Per sincronizzare l'animazione
        
        const container = document.getElementById('canvas-container');
        const loaderSpinner = document.getElementById('loader-spinner');

        // --- 1. SETUP AMBIENTE ---
        function initThreeJS() {
            if (renderer) return; 

            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x151515); // Grigio scuro elegante
            // Nebbia più lontana per vedere l'ambiente (inizia a 20m, finisce a 100m)
            scene.fog = new THREE.Fog(0x151515, 20, 100); 

            // Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000); // 1000m di vista
            camera.position.set(0, 10, 20); // Posizione iniziale alta

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true; // Abilita ombre
            renderer.shadowMap.type = THREE.PCFSoftShadowMap; // Ombre morbide
            container.appendChild(renderer.domElement);

            // --- ILLUMINAZIONE AVANZATA (Fix Buio) ---
            
            // 1. Hemisphere Light: Luce ambiente naturale (Cielo bluastro / Terra scura)
            // Questo illumina TUTTO uniformemente, così non hai zone nere.
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
            hemiLight.position.set(0, 20, 0);
            scene.add(hemiLight);

            // 2. Directional Light: Il "Sole" o i riflettori dello stadio (fa le ombre)
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            // Aumenta l'area in cui le ombre vengono calcolate
            dirLight.shadow.camera.top = 20;
            dirLight.shadow.camera.bottom = -20;
            dirLight.shadow.camera.left = -20;
            dirLight.shadow.camera.right = 20;
            dirLight.shadow.mapSize.width = 2048; // Alta risoluzione ombre
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            // Griglia di riferimento molto grande (50x50 metri)
            const gridHelper = new THREE.GridHelper(50, 50, 0x444444, 0x222222);
            scene.add(gridHelper);

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; // Inerzia fluida
            controls.dampingFactor = 0.05;
            controls.enablePan = true; // ABILITA SPOSTAMENTO (Tasto Destro)
            controls.screenSpacePanning = false; // Pan sul piano orizzontale (come camminare)
            controls.minDistance = 2;   // Non entrare dentro il giocatore
            controls.maxDistance = 50;  // Non allontanarti troppo
            controls.maxPolarAngle = Math.PI / 2 - 0.05; // Non andare sotto il pavimento
            
            window.addEventListener('resize', onWindowResize);
        }

        // --- 2. CARICAMENTO E CENTRATURA ---
        function loadShotModel() {
            if(model) { scene.remove(model); model = null; }
            if(mixer) { mixer.stopAllAction(); mixer = null; }
            
            loaderSpinner.style.display = 'flex';

            const loader = new GLTFLoader();
            
            loader.load('./placeholder.glb', function (gltf) {
                model = gltf.scene;
                
                // Abilita le ombre su tutti gli oggetti del modello
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                scene.add(model);

                // --- FIX PIVOT (CENTRAGGIO AUTOMATICO) ---
                // 1. Calcola il box che contiene tutto il modello
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());

                // 2. Opzione A: Sposta il modello in modo che il suo centro sia a 0,0,0
                // model.position.x += (model.position.x - center.x);
                // model.position.z += (model.position.z - center.z);
                // model.position.y = 0; // Tieni i piedi per terra

                // 2. Opzione B (Migliore): Lascia il modello dov'è, ma sposta i CONTROLLI
                // Diciamo alla camera di guardare ESATTAMENTE al centro dell'azione
                controls.target.copy(center); 
                
                // Riposiziona la camera in una bella angolazione rispetto al centro
                camera.position.set(center.x + 10, center.y + 8, center.z + 10);
                controls.update(); // Applica i cambiamenti

                // --- ANIMAZIONE ---
                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(model);
                    // Fa partire tutte le animazioni trovate (es. giocatore, palla)
                    gltf.animations.forEach((clip) => {
                        mixer.clipAction(clip).play();
                    });
                }

                loaderSpinner.style.display = 'none';
                animate();

            }, undefined, function (error) {
                console.warn('Errore loading o file mancante. Carico sfera di test.');
                // Fallback semplice
                const geo = new THREE.SphereGeometry(2, 32, 32);
                const mat = new THREE.MeshStandardMaterial({ color: 0xf97316 });
                model = new THREE.Mesh(geo, mat);
                model.position.y = 2;
                scene.add(model);
                controls.target.set(0,2,0);
                loaderSpinner.style.display = 'none';
                animate();
            });
        }

        function onWindowResize() {
            if(!camera) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            if (!document.getElementById('overlay-3d').classList.contains('visible-overlay')) return;

            animationId = requestAnimationFrame(animate);
            
            const delta = clock.getDelta(); // Tempo passato dall'ultimo frame
            if (mixer) mixer.update(delta); // Aggiorna animazione
            
            controls.update();
            renderer.render(scene, camera);
        }

        // --- FUNZIONI UTENTE (Globali) ---

        window.togglePlay = function(play) {
            if(!mixer) return;
            // TimeScale: 1 = normale, 0 = pausa, -1 = reverse
            mixer.timeScale = play ? 1 : 0;
        }

        window.resetCamera = function() {
            if(model && controls) {
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                controls.target.copy(center);
                camera.position.set(center.x + 10, center.y + 8, center.z + 10);
                controls.update();
            }
        }

        window.openOverlay = function(shotId, result) {
            document.getElementById('overlay-3d').classList.remove('hidden-overlay');
            document.getElementById('overlay-3d').classList.add('visible-overlay');
            document.getElementById('overlay-title').innerText = result === 'make' ? "LEBRON - MAKE" : "LEBRON - MISS";
            
            initThreeJS();
            loadShotModel();
            
            if(window.lucide) lucide.createIcons(); // Ricarica icone per i nuovi bottoni
        }

        window.closeOverlay = function() {
            document.getElementById('overlay-3d').classList.remove('visible-overlay');
            document.getElementById('overlay-3d').classList.add('hidden-overlay');
            if(animationId) cancelAnimationFrame(animationId);
            if(mixer) mixer.stopAllAction(); // Ferma animazione
        }
    </script>

    <script>
        // --- LOGICA DATI & GENERAZIONE ---
        function generateRandomShots(count) {
            const shots = [];
            for (let i = 0; i < count; i++) {
                const randX = Math.random() * 48 + 1; 
                const randY = Math.random() * 42 + 2; 
                const isMake = Math.random() > 0.5;
                
                shots.push({
                    id: `shot_${Math.floor(Math.random() * 1000)}`, // ID stringa
                    x: randX,
                    y: randY,
                    result: isMake ? 'make' : 'miss',
                    player: Math.random() > 0.6 ? 'LeBron James' : 'Other'
                });
            }
            return shots;
        }

        const shotsData = generateRandomShots(20);
        const markersLayer = document.getElementById('markers-layer');
        const btnAll = document.getElementById('btn-all');
        const btnPlayer = document.getElementById('btn-player');

        function renderShots(filterPlayer = null) {
            markersLayer.innerHTML = ''; 

            shotsData.forEach(shot => {
                const leftPos = (shot.x / 50) * 100;
                const topPos = (shot.y / 47) * 100;

                const el = document.createElement('div');
                el.className = `marker absolute flex items-center justify-center -translate-x-1/2 -translate-y-1/2 cursor-pointer`;
                el.style.left = `${leftPos}%`;
                el.style.top = `${topPos}%`;

                if (filterPlayer && shot.player !== filterPlayer && filterPlayer !== 'all') {
                    el.classList.add('dimmed');
                } else {
                    // Solo se non è dimmed è cliccabile per l'overlay
                    // MODIFICA QUI: Invece del console.log, chiamiamo window.openOverlay
                    el.onclick = () => window.openOverlay(shot.id, shot.result);
                }

                if (shot.result === 'make') {
                    el.innerHTML = `<div class="w-3 h-3 md:w-4 md:h-4 rounded-full border-2 border-orange-500 bg-transparent shadow-[0_0_10px_#f97316]"></div>`;
                } else {
                    el.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 md:w-5 md:h-5 drop-shadow-[0_0_8px_#f97316]">
                            <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
                        </svg>`;
                }
                markersLayer.appendChild(el);
            });
            
            if(window.lucide) lucide.createIcons();
        }

        function filterShots(type) {
            const player = type === 'player' ? 'LeBron James' : 'all';
            const activeClass = "bg-orange-600 text-white shadow-[0_0_10px_rgba(249,115,22,0.5)]";
            const inactiveClass = "text-neutral-500 hover:text-orange-400 bg-transparent shadow-none";

            if(type === 'all') {
                btnAll.className = `px-6 py-2 text-xs font-bold rounded-full transition-all ${activeClass}`;
                btnPlayer.className = `px-6 py-2 text-xs font-bold rounded-full transition-all ${inactiveClass}`;
            } else {
                btnAll.className = `px-6 py-2 text-xs font-bold rounded-full transition-all ${inactiveClass}`;
                btnPlayer.className = `px-6 py-2 text-xs font-bold rounded-full transition-all ${activeClass}`;
            }
            renderShots(player);
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderShots('all');
            lucide.createIcons();
        });
    </script>
</body>
</html>
