<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Shot Chart - 2D to 3D Bridge</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #050505; }

        /* COURT CONFIGURATION*/
        .court-container {
            aspect-ratio: 50/47; 
            width: 100%;
            max-width: 950px; 
            position: relative;
            background-color: #0a0a0a;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(40,40,40, 0.4), rgba(0,0,0,0.95)), 
                linear-gradient(0deg, rgba(255,255,255,0.03) 1px, transparent 1px), 
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); 
            background-size: 100% 100%, 4% 4%, 4% 4%;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 80px rgba(0,0,0,0.9);
            border: 1px solid #222;
            margin: 0;
        }

        .court-line {
            position: absolute;
            border: 2px solid #f97316; 
            box-shadow: 0 0 6px #f97316, inset 0 0 6px rgba(249, 115, 22, 0.2);
            opacity: 0.9;
            z-index: 1; 
            pointer-events: none;
        }

        .court-key {
            position: absolute; width: 32%; height: 40.43%; left: 34%; top: 0; 
            background-color: rgba(249, 115, 22, 0.1); border: 2px solid #f97316; border-top: none; 
        }

        .court-freethrow-circle {
            position: absolute; width: 24%; height: 25.53%; left: 38%; top: 27.66%;
            border-radius: 50%; border: 2px solid #f97316; margin-top: -1px; 
            clip-path: polygon(0 50%, 100% 50%, 100% 100%, 0 100%);
        }
        
        .court-corner-patch {
            position: absolute; top: 0; left: 0; width: 15px; height: 15px;
            background-color: #0a0a0a;
            z-index: 4;
        }

        .court-freethrow-dashed {
            position: absolute; width: 24%; height: 25.53%; left: 38%; top: 27.65%;
            border-radius: 50%; border: none;
            background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3e%3ccircle cx='50' cy='50' r='49' fill='none' stroke='rgba(249, 115, 22, 0.5)' stroke-width='1.5' stroke-dasharray='10%2c 15' /%3e%3c/svg%3e");
            clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%); z-index: 1;
        }

        .court-3pt-arc {
            position: absolute; width: 93%; padding-bottom: 93%; left: 3.5%; top: -39.36%;
            clip-path: polygon(0 50%, 100% 50%, 100% 150%, 0 150%); z-index: 5; pointer-events: none;
        }

        .court-3pt-arc::before {
            content: ''; position: absolute; inset: 0; border-radius: 50%;
            border: 2px solid #f97316; clip-path: polygon(0 68.4%, 100% 68.4%, 100% 130%, 0 130%); z-index: 2;
        }

        .court-3pt-line-left, .court-3pt-line-right {
            position: absolute; top: 0; width: 2px; height: 28.5%; background-color: #f97316; z-index: 1;
        }

        .court-3pt-line-left { left: 6.8%; }
        .court-3pt-line-right { right: 6.8%; }

        .court-backboard {
            width: 12%; height: 2px; background: #f97316; left: 44%; top: 8.51%; 
            box-shadow: 0 0 15px rgba(255,255,255,0.6); border: none; z-index: 2;
        }

        .court-hoop {
            width: 3%; height: 3.2%; left: 48.5%; top: 9.3%; 
            border: 2px solid #fff; background-color: rgba(249, 115, 22, 0.1); border-radius: 50%; 
            box-shadow: 0 0 8px #fff; z-index: 2;
        }

        .court-center-line {
            width: 100%; height: 2px; bottom: 0; left: 0; 
            border-bottom: 2px solid #f97316; box-shadow: 0 0 10px #f97316;
        }
        
        .court-center-circle-top {
            width: 24%; padding-bottom: 12%; left: 38%; bottom: 0; position: absolute;
            border-top-left-radius: 100px; border-top-right-radius: 100px; 
            border: 2px solid #f97316; border-bottom: none; z-index: 1;
        }

        .neon-text { text-shadow: 0 0 10px rgba(249, 115, 22, 0.8); }
        
        /* Marker Styles */
        .marker { transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 10; }
        .marker:hover { 
            z-index: 50; transform: translate(-50%, -50%) scale(1.5); 
            filter: drop-shadow(0 0 8px #f97316) brightness(1.3);
        }
        .marker.dimmed { opacity: 0.8; filter: grayscale(100%); transform: translate(-50%, -50%) scale(0.8); }
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-entry { animation: fade-in 0.8s ease-out forwards; }

        .court-container {
            aspect-ratio: 50/47; 
            width: 100%;
            max-width: 850px; 
            position: relative;
            background-color: #0a0a0a;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(40,40,40, 0.4), rgba(0,0,0,0.95)), 
                linear-gradient(0deg, rgba(255,255,255,0.03) 1px, transparent 1px), 
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); 
            background-size: 100% 100%, 4% 4%, 4% 4%;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 80px rgba(0,0,0,0.9);
            border: 1px solid #222;
            margin: 0;
        }


        #overlay-3d {
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        
        #overlay-3d.hidden-overlay {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        
        #overlay-3d.visible-overlay {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .loader {
            border: 4px solid rgba(249, 115, 22, 0.1);
            width: 36px; height: 36px; border-radius: 50%;
            border-left-color: #f97316;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body class="bg-neutral-950 text-neutral-300 h-screen w-screen overflow-hidden flex items-center justify-center relative">

    <nav class="absolute top-0 w-full flex justify-start py-8 px-12 z-40 pointer-events-none">
        <div class="pointer-events-auto flex items-center gap-3 text-orange-500">
            <i data-lucide="basketball" class="w-8 h-8 neon-text"></i>
            <span class="font-bold tracking-[0.3em] text-sm neon-text uppercase">Sport Tech 25/26</span>
        </div>
    </nav>

    <main class="w-full max-w-[1600px] px-12 flex flex-row items-center justify-center gap-16 animate-entry" id="dashboard-container">
        
    <div class="flex flex-col w-[450px] shrink-0 h-full"> <h1 class="text-7xl font-black text-transparent bg-clip-text bg-gradient-to-b from-orange-400 to-orange-700 neon-text select-none leading-[0.9] mb-10 italic">
            VIRTUAL<br>BASKET
        </h1>
        
        <div class="space-y-6">
            <div>
                <label class="block text-orange-500 text-[10px] font-bold tracking-[0.3em] uppercase mb-2 ml-1">Team</label>
                <select id="select-team" class="custom-select w-full bg-black/40 border-2 border-orange-500/20 text-white text-lg font-bold py-4 px-6 rounded-xl focus:border-orange-500 focus:outline-none transition-all cursor-pointer">
                    <option value="all">ALL TEAMS</option>
                    <option value="lakers">LA LAKERS</option>

                </select>
            </div>

            <div>
                <label class="block text-orange-500 text-[10px] font-bold tracking-[0.3em] uppercase mb-2 ml-1">Game</label>
                <select id="select-game" class="custom-select w-full bg-black/40 border-2 border-orange-500/20 text-white text-lg font-bold py-4 px-6 rounded-xl focus:border-orange-500 focus:outline-none transition-all cursor-pointer">
                    <option value="all">ALL SEASON</option>
                    <option value="game1">vs Denver Nuggets - 12/10</option>
                    <option value="game2">vs Boston Celtics - 15/10</option>
                </select>
            </div>

            <div>
                <label class="block text-orange-500 text-[10px] font-bold tracking-[0.3em] uppercase mb-2 ml-1">Player</label>
                <select id="select-player" class="custom-select w-full bg-black/40 border-2 border-orange-500/20 text-white text-lg font-bold py-4 px-6 rounded-xl focus:border-orange-500 focus:outline-none transition-all cursor-pointer">
                    <option value="all">ALL PLAYERS</option>
                    <option value="LeBron">LEBRON JAMES</option>
                    <option value="AD">ANTHONY DAVIS</option>
                </select>
            </div>
        </div>

        <div class="mt-auto pt-10">
            <p class="text-neutral-600 text-[10px] font-mono tracking-[0.3em] uppercase leading-relaxed">
                Designed & Developed by:<br>
                <span class="text-neutral-400">Michele Lovato Menin & Tommaso Ballarini</span>
            </p>
        </div>
    </div>

        <div class="flex-1 flex flex-col items-center">
            <div id="court-area" class="court-container shadow-[0_0_100px_rgba(249,115,22,0.1)]">
                <div class="court-corner-patch"></div>
                <div class="court-line court-key"></div>
                <div class="court-freethrow-circle"></div> 
                <div class="court-freethrow-dashed"></div> 
                <div class="court-3pt-line-left"></div>
                <div class="court-3pt-line-right"></div>
                <div class="court-3pt-arc"></div>
                <div class="court-line court-restricted"></div>
                <div class="court-line court-backboard"></div>
                <div class="court-line court-hoop"></div>
                <div class="court-line court-center-line"></div>
                <div class="court-center-circle-top"></div>
                <div id="markers-layer" class="absolute inset-0 w-full h-full z-10"></div>
            </div>
    </main>

   <div id="overlay-3d" class="fixed inset-0 z-50 bg-black/95 flex items-center justify-center hidden-overlay">
    
        <div class="absolute top-6 left-8 z-50 pointer-events-none">
            <h2 id="overlay-title" class="text-3xl font-bold text-orange-500 neon-text italic">REPLAY MODE</h2>
            <p id="overlay-desc" class="text-xs text-neutral-400 font-mono mt-1 tracking-widest">INTERACTIVE VIEW</p>
        </div>

        <button onclick="closeOverlay()" class="absolute top-6 right-8 text-white hover:text-orange-500 transition z-[100] cursor-pointer bg-neutral-800 p-2 rounded-full hover:bg-neutral-700 border border-neutral-700">
            <i data-lucide="x" class="w-6 h-6"></i>
        </button>

        <div id="canvas-container" class="w-full h-full relative outline-none cursor-move">
            <div id="loader-spinner" class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div class="loader"></div>
            </div>
        </div>

        <div class="absolute bottom-10 left-1/2 -translate-x-1/2 z-50 flex gap-4 bg-neutral-900/80 backdrop-blur border border-neutral-700 px-6 py-3 rounded-full shadow-2xl">
            <button onclick="togglePlay(false)" class="text-neutral-400 hover:text-white transition tooltip" title="Pause">
                <i data-lucide="pause" class="w-5 h-5 fill-current"></i>
            </button>
            <button onclick="togglePlay(true)" class="text-orange-500 hover:text-orange-400 transition tooltip" title="Play">
                <i data-lucide="play" class="w-5 h-5 fill-current"></i>
            </button>
            <div class="w-px h-5 bg-neutral-700 mx-2"></div>
            <button onclick="resetCamera()" class="text-neutral-400 hover:text-white transition text-xs font-bold tracking-wider pt-1">
                RESET VIEW
            </button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- GLOBAL VARIABLES ---
        let scene, camera, renderer, controls, animationId;
        let model = null;
        let mixer = null;
        let clock = new THREE.Clock();
        
        const container = document.getElementById('canvas-container');
        const loaderSpinner = document.getElementById('loader-spinner');

        // ENVIRONMENT SETUP
        function initThreeJS() {
            if (renderer) return; 

            // SCENE
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a); 

            // CAMERA
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 20);

            // RENDERER
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            
            // Color Management
            renderer.outputColorSpace = THREE.SRGBColorSpace; 
            
            // Explicitly disable shadows for cleanliness and performance
            renderer.shadowMap.enabled = false; 
            
            container.appendChild(renderer.domElement);

            // MANUAL LIGHTS (The fix for darkness)
            
            // Ambient Light: Illuminates everything uniformly at 60%
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); 
            scene.add(ambientLight);

            // B. Directional Light (The Sun/Main Spotlight)
            const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
            dirLight.position.set(10, 30, 20);
            scene.add(dirLight);

            // (Optional) Fill light from opposite side to avoid too dark sides on players
            const fillLight = new THREE.DirectionalLight(0xffffff, 1.0);
            fillLight.position.set(-10, 20, -10);
            scene.add(fillLight);

            // CONTROLS
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; 
            controls.dampingFactor = 0.05;
            controls.enablePan = true; 
            controls.minDistance = 2; 
            controls.maxDistance = 80; 
            controls.maxPolarAngle = Math.PI / 2 - 0.05;
            
            window.addEventListener('resize', onWindowResize);
        }
        // LOADING
        function loadShotModel(matchId, eventId) {
            if(model) { scene.remove(model); model = null; }
            if(mixer) { mixer.stopAllAction(); mixer = null; }
            
            loaderSpinner.style.display = 'flex';

            const loader = new GLTFLoader();
            const fileName = `./output/${matchId}-${eventId}.glb`;

            loader.load(fileName, function (gltf) {
                model = gltf.scene;
                

                scene.add(model);

                // CAMERA FIX
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                controls.target.copy(center); 
                camera.position.set(center.x + 10, center.y + 8, center.z + 10);
                controls.update(); 

                // --- ANIMATION ---
                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(model);
                    gltf.animations.forEach((clip) => {
                        mixer.clipAction(clip).play();
                    });
                }

                loaderSpinner.style.display = 'none';
                animate();

            }, undefined, function (error) {
                console.error(`Error loading: ${fileName}`, error);
                loaderSpinner.style.display = 'none';
                document.getElementById('overlay-title').innerText = "REPLAY UNAVAILABLE";
            });
        }

        function onWindowResize() {
            if(!camera) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            if (!document.getElementById('overlay-3d').classList.contains('visible-overlay')) return;
            animationId = requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            controls.update();
            renderer.render(scene, camera);
        }

        // USER FUNCTION
        window.togglePlay = function(play) {
            if(!mixer) return;
            mixer.timeScale = play ? 1 : 0;
        }

        window.resetCamera = function() {
            if(model && controls) {
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                controls.target.copy(center);
                camera.position.set(center.x + 10, center.y + 8, center.z + 10);
                controls.update();
            }
        }

        window.openOverlay = function(matchId, eventId, playerName, result) {
            document.getElementById('overlay-3d').classList.remove('hidden-overlay');
            document.getElementById('overlay-3d').classList.add('visible-overlay');
            document.getElementById('overlay-title').innerText = `${playerName.toUpperCase()} - ${result === 'make' ? "MAKE" : "MISS"}`;
            
            initThreeJS();
            loadShotModel(matchId, eventId);
            
            if(window.lucide) lucide.createIcons();
        }

        window.closeOverlay = function() {
            const overlay = document.getElementById('overlay-3d');
            overlay.classList.remove('visible-overlay');
            overlay.classList.add('hidden-overlay');
            document.getElementById('loader-spinner').style.display = 'none';
            if(animationId) cancelAnimationFrame(animationId);
            if(mixer) { mixer.stopAllAction(); mixer = null; }
            setTimeout(() => {
                document.getElementById('overlay-title').innerText = "REPLAY MODE";
            }, 500);
        }
    </script>

    <script>
        // GLOBAL VARIABLES
        let shotsData = [];
        const markersLayer = document.getElementById('markers-layer');

        // FUNCTION TO POPULATE FILTERS
        function populateFilters(filters) {
            const fillSelect = (id, list, allText) => {
                const select = document.getElementById(id);
                if (!select) return;
                select.innerHTML = `<option value="all">${allText}</option>`;
                list.forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item;
                    opt.textContent = item.toUpperCase();
                    select.appendChild(opt);
                });
            };

            populateFiltersData(filters);
        }

        // Helper to populate filter data
        function populateFiltersData(filters) {
            const fillSelect = (id, list, allText) => {
                const select = document.getElementById(id);
                if (!select) return;
                select.innerHTML = `<option value="all">${allText}</option>`;
                list.forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item;
                    opt.textContent = item.toUpperCase();
                    select.appendChild(opt);
                });
            };
            fillSelect('select-team', filters.teams, 'ALL TEAMS');
            fillSelect('select-game', filters.matches, 'ALL SEASON');
            fillSelect('select-player', filters.players, 'ALL PLAYERS');
        }

        // RENDERING FUNCTION (Draws shots on court) ---
        function renderShots() {
            const teamFilter = document.getElementById('select-team').value;
            const gameFilter = document.getElementById('select-game').value;
            const playerFilter = document.getElementById('select-player').value;

            markersLayer.innerHTML = ''; 

            shotsData.forEach(shot => {
                // Calculate percentage positions relative to 50x47 ft court
                const leftPos = (shot.x / 50) * 100;
                const topPos = (shot.y / 47) * 100;

                // Check of the 3 crossed filters
                const matchTeam = teamFilter === 'all' || shot.team === teamFilter;
                const matchGame = gameFilter === 'all' || shot.match === gameFilter;
                const matchPlayer = playerFilter === 'all' || shot.player === playerFilter;

                const isVisible = matchTeam && matchGame && matchPlayer;

                const el = document.createElement('div');
                el.className = `marker absolute flex items-center justify-center -translate-x-1/2 -translate-y-1/2 cursor-pointer`;
                el.style.left = `${leftPos}%`;
                el.style.top = `${topPos}%`;

                if (!isVisible) {
                    el.classList.add('dimmed'); // If it doesn't pass the filter, it becomes gray/transparent
                } else {
                    // Clickable only if visible for 3D overlay
                    el.onclick = () => window.openOverlay(shot.matchId, shot.eventId, shot.player, shot.made ? 'make' : 'miss');
                }

                // Draw icon: Circle (Made) or X (Missed)
                if (shot.made) {
                    el.innerHTML = `<div class="w-3 h-3 md:w-4 md:h-4 rounded-full border-2 border-orange-500 bg-transparent shadow-[0_0_10px_#f97316]"></div>`;
                } else {
                    el.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 md:w-5 md:h-5 drop-shadow-[0_0_8px_#f97316]">
                            <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
                        </svg>`;
                }
                markersLayer.appendChild(el);
            });
            
            // Re-initialize Lucide icons if necessary
            if(window.lucide) lucide.createIcons();
        }

        // INITIAL LOADING LOGIC
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Call to your backend.py (port 5000)
                const response = await fetch('http://127.0.0.1:5000/api/shots');
                
                if (!response.ok) throw new Error("Backend unreachable");
                
                const data = await response.json();

                // Save shots in the variable used by renderShots
                shotsData = data.shots; 
                
                // Populate dropdown menus with real JSON data
                populateFiltersData(data.filters);

                // Connect "change" event to menus to update the court
                ['select-team', 'select-game', 'select-player'].forEach(id => {
                    const selectEl = document.getElementById(id);
                    if(selectEl) selectEl.addEventListener('change', renderShots);
                });

                // First automatic draw
                renderShots();
                if(window.lucide) lucide.createIcons();

            } catch (error) {
                console.error("Fatal error:", error);
                // Visual message for user if they forget to turn on Python
                markersLayer.innerHTML = `<div class="text-orange-500 font-bold p-10 text-center">ERROR: Ensure backend.py is running!</div>`;
            }
        });
    </script>
